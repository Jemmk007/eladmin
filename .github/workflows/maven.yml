      # 5. 上传 jar 包到远程服务器
    - name: Deploy JAR via SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}  # 服务器SSH私钥
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}         # 服务器IP
        REMOTE_USER: ${{ secrets.REMOTE_USER }}         # 服务器用户名
        JAR_NAME:  ./eladmin-system/target/*.jar                      
        REMOTE_DIR: /home/ecs-user/Jem-test
      run: |
        # 安装 ssh-agent 并添加私钥
        sudo apt-get install -y openssh-client
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

        # 禁用主机密钥检查（首次连接避免交互提示）
        echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" > ~/.ssh/config
        echo -e "hello world" >/dev/null
        #ls $JAR_NAME
        pwd && ls
        ls ./eladmin-system/*
        echo "Runner IPv4: $(curl -s ifconfig.me)"
